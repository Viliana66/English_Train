<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English Train">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>English Train</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
  --dark:#111827;--good:#e9f7ef;--bad:#fff0f0;--accent:#eef2ff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.app{max-width:680px;margin:0 auto;padding:12px 0 28px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:4px 2px 12px}
.brand{font-size:20px;font-weight:800}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:999px}
.progress{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress>div{height:100%;background:#111827;width:0}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.pill{font-size:13px;background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:#374151}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;min-height:340px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 8px 30px rgba(17,24,39,.06);user-select:none;-webkit-user-select:none}
.lang{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:16px}
.sentence{font-size:28px;line-height:1.25;font-weight:750}
.hint{margin-top:20px;color:var(--muted);font-size:14px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{appearance:none;border:0;border-radius:16px;padding:15px 12px;font-size:17px;font-weight:700;touch-action:manipulation}
button:active{transform:scale(.99)}
.flip{grid-column:1/-1;background:var(--dark);color:#fff}
.bad{background:var(--bad);color:#9b1c1c}
.good{background:var(--good);color:#166534}
.audio{grid-column:1/-1;background:var(--accent);color:#3730a3}
.secondary{grid-column:1/-1;background:#fff;color:#374151;border:1px solid var(--line)}
.hidden{display:none!important}
.end{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 20px;text-align:center}
.end h2{margin-top:0}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.target-word{color:#d11a2a;font-weight:850}
.verb-forms{margin-top:18px;font-size:17px;color:#6b7280;font-weight:700}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 0 14px}
.filter-btn{background:#fff;border:1.5px solid #60a5fa;padding:9px 6px;border-radius:12px;font-size:13px;font-weight:700;color:#1e3a8a}
.filter-btn.active{background:#dbeafe;color:#1e3a8a;border-color:#1e3a8a}
.filter-btn.new-tab{background:#c81e1e;color:#fff;border-color:#c81e1e;font-weight:850}
.filter-btn.new-tab.active{background:#991b1b;color:#fff;border-color:#991b1b;box-shadow:0 0 0 3px rgba(200,30,30,.14)}
.filter-btn.drill-tab{background:#fff;color:#1e3a8a;border-color:#60a5fa;font-weight:800}
.filter-btn.drill-tab.active{background:#dbeafe;color:#1e3a8a;border-color:#1e3a8a;box-shadow:0 0 0 2px rgba(30,58,138,.08)}
.tense-note{margin-top:10px;font-size:13px;color:#6b7280;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
@media(max-width:420px){.filters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){
 .sentence{font-size:25px}
 .card{min-height:320px}
}

.main-nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:0 0 12px;
}
.main-btn{
  background:#eff6ff;
  border:1.5px solid #1e3a8a;
  padding:12px 8px;
  border-radius:14px;
  font-size:15px;
  font-weight:850;
  color:#1e3a8a;
}
.main-btn.active{
  background:#1e3a8a;
  color:#fff;
  border-color:#1e3a8a;
}
.submenu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:0 0 14px;
}
.submenu.hidden{
  display:none;
}
.course-panel{
  border:1px dashed #93c5fd;
  background:#eff6ff;
  border-radius:16px;
  padding:22px 18px;
  margin:0 0 16px;
  text-align:center;
}
.course-panel h3{
  margin:0 0 8px;
  font-size:20px;
}
.course-panel p{
  margin:0;
  color:#4b5563;
  line-height:1.45;
}
@media(max-width:420px){
  .main-nav{grid-template-columns:repeat(2,1fr)}
  .submenu{grid-template-columns:repeat(2,1fr)}
}


.stage-stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin:-6px 0 14px;
}
.stage-pill{
  text-align:center;
  border:1px solid #93c5fd;
  border-radius:10px;
  padding:6px 3px;
  font-size:11px;
  font-weight:800;
  color:#1e3a8a;
  background:#fff;
}
.stage-pill b{display:block;font-size:15px;margin-top:2px}
.stage-pill.s1{background:#f8fbff}
.stage-pill.s2{background:#eff6ff}
.stage-pill.s3{background:#eaf3ff}
.stage-pill.s4{background:#dbeafe}
.stage-pill.s5{background:#bfdbfe;border-color:#1e3a8a}
.stage-indicator{
  margin-top:18px;
  padding:6px 11px;
  border-radius:999px;
  background:#eff6ff;
  color:#1e3a8a;
  border:1px solid #bfdbfe;
  font-size:13px;
  font-weight:800;
}
@media(max-width:420px){
  .stage-stats{gap:4px}
  .stage-pill{font-size:10px;padding:5px 1px}
}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">English Train</div>
    <div class="timer" id="timer">15:00</div>
  </div>

  <div class="progress"><div id="progressBar"></div></div>

  <div class="stats">
    <div class="pill">Today: <b id="todayCount">0</b></div>
    <div class="pill">Learned: <b id="learnedCount">0</b></div>
    <div class="pill">Mastered: <b id="masteredCount">0</b></div>
    <div class="pill">Open: <b id="openCount">0</b></div>
  </div>
  <div class="stage-stats">
    <div class="stage-pill s1">Stage 1 <b id="stage1Count">0</b></div>
    <div class="stage-pill s2">Stage 2 <b id="stage2Count">0</b></div>
    <div class="stage-pill s3">Stage 3 <b id="stage3Count">0</b></div>
    <div class="stage-pill s4">Stage 4 <b id="stage4Count">0</b></div>
    <div class="stage-pill s5">Stage 5 <b id="stage5Count">0</b></div>
  </div>
  <div class="main-nav" id="mainNav">
    <button class="main-btn active" data-top="all">All</button>
    <button class="main-btn" data-top="vocabulary">Vocabulary</button>
    <button class="main-btn" data-top="drill">Drill</button>
    <button class="main-btn course-main" data-top="course">Course</button>
  </div>

  <div class="submenu hidden" id="vocabularyMenu">
    <button class="filter-btn" data-mode="noun">Nouns</button>
    <button class="filter-btn" data-mode="adjective">Adjectives</button>
    <button class="filter-btn" data-mode="verb">Verbs</button>
    <button class="filter-btn" data-mode="adverb">Adverbs</button>
    <button class="filter-btn" data-mode="conjunction">Conjunctions</button>
    <button class="filter-btn" data-mode="preposition">Prepositions</button>
  </div>

  <div class="submenu hidden" id="drillMenu">
    <button class="filter-btn drill-tab" data-mode="drill_present">Present Simple</button>
    <button class="filter-btn drill-tab" data-mode="drill_past">Past Simple</button>
    <button class="filter-btn drill-tab" data-mode="drill_presentperfect">Present Perfect</button>
    <button class="filter-btn drill-tab" data-mode="drill_future">Future</button>
    <button class="filter-btn drill-tab" data-mode="drill_conditional">Conditional</button>
    <button class="filter-btn drill-tab" data-mode="drill_shouldhave">Should Have</button>
    <button class="filter-btn drill-tab" data-mode="drill_pastperfect">Past Perfect</button>
  </div>

  <div class="submenu hidden" id="courseMenu">
    <button class="filter-btn" data-mode="course_questions">Questions</button>
  </div>

  <div id="study">
    <div class="card" id="card" role="button" aria-label="Flip card">
      <div class="lang" id="lang">Български</div>
      <div class="sentence" id="sentence"></div>
      <div class="stage-indicator" id="stageIndicator">Stage 0 / 5 · Open</div>
      <div class="hint" id="hint">Tap to flip</div>
    </div>

    <div class="controls">
      <button class="flip" id="flipBtn">Show English</button>
      <button class="bad hidden" id="againBtn">↻ Learn again</button>
      <button class="good hidden" id="goodBtn">✓ Learned</button>
      <button class="audio hidden" id="audioBtn">🔊 Listen</button>
      <button class="secondary" id="pauseBtn">Pause</button>
    </div>
  </div>

  <div id="end" class="end hidden">
    <h2>Session complete</h2>
    <p id="endText"></p>
    <button class="flip" id="restartBtn">Another 15 minutes</button>
    <p class="small">Your progress is saved on this device. Difficult cards return sooner.</p>
  </div>
</div>

<script src="cards.js"></script>
<script>
(() => {
  const SESSION_SECONDS = 15*60;
  const STORE = "english-train-v3";
  const $ = id => document.getElementById(id);
  let state, queue=[], current=null, flipped=false, remaining=SESSION_SECONDS, timerId=null, paused=false, sessionSeen=0, sessionGood=0, mode='all';

  function now(){ return Date.now(); }
  function todayKey(){ return new Date().toISOString().slice(0,10); }
  function defaultCardState(){ return {stage:0,due:0,seen:0,good:0,bad:0}; }

  function defaultWordState(){
    return {stage:0,seen:0,good:0,bad:0};
  }

  function verbKey(card){
    return String(card.word || "").toLowerCase();
  }

  function load(){
    try{ state=JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ state={}; }
    state.cards = state.cards || {};
    state.daily = state.daily || {};
    state.verbWords = state.verbWords || {};
    state.migrations = state.migrations || {};

    // Preserve all existing stable cards 0–874.
    for(let i=0;i<875;i++){
      if(!state.cards[i]) state.cards[i]=defaultCardState();
    }

    // The old NEW block was removed, so Drill indexes moved.
    // Reset only the Drill range once to avoid inheriting NEW statistics.
    if(!state.migrations.drillTabsFixedV1){
      for(let i=875;i<CARDS.length;i++){
        state.cards[i]=defaultCardState();
      }
      state.migrations.drillTabsFixedV1=true;
    }

    for(let i=875;i<CARDS.length;i++){
      if(!state.cards[i]) state.cards[i]=defaultCardState();
    }

    // Word-based status is used only for the normal Verbs tab.
    if(!state.migrations.verbWordOnlyV1){
      for(let i=0;i<CARDS.length;i++){
        const card=CARDS[i];
        if((card.group||"")!=="verb") continue;
        const key=verbKey(card);
        if(!state.verbWords[key]) state.verbWords[key]=defaultWordState();

        const ws=state.verbWords[key];
        const cs=state.cards[i] || defaultCardState();
        const legacy=(state.words && state.words["verb:"+key]) ? state.words["verb:"+key] : null;

        if(legacy){
          ws.stage=Math.max(ws.stage||0, legacy.stage||0);
          ws.seen=Math.max(ws.seen||0, legacy.seen||0);
          ws.good=Math.max(ws.good||0, legacy.good||0);
          ws.bad=Math.max(ws.bad||0, legacy.bad||0);
        } else {
          ws.stage=Math.max(ws.stage||0, cs.stage||0);
          ws.seen=(ws.seen||0)+(cs.seen||0);
          ws.good=(ws.good||0)+(cs.good||0);
          ws.bad=(ws.bad||0)+(cs.bad||0);
        }
      }
      state.migrations.verbWordOnlyV1=true;
    }

    for(let i=0;i<CARDS.length;i++){
      const card=CARDS[i];
      if((card.group||"")==="verb"){
        const key=verbKey(card);
        if(!state.verbWords[key]) state.verbWords[key]=defaultWordState();
      }
    }

    // One-time migration to a transparent 5-stage system.
    // Previous Stage 4+ already counted as Mastered, so preserve that
    // by mapping it to Stage 5.
    if(!state.migrations.fiveStageV1){
      for(let i=0;i<CARDS.length;i++){
        const s=state.cards[i];
        if(!s) continue;
        const oldStage=Number(s.stage||0);
        if(oldStage>=4) s.stage=5;
        else s.stage=Math.max(0,Math.min(3,oldStage));
      }

      Object.keys(state.verbWords||{}).forEach(key=>{
        const w=state.verbWords[key];
        const oldStage=Number(w.stage||0);
        if(oldStage>=4) w.stage=5;
        else w.stage=Math.max(0,Math.min(3,oldStage));
      });

      state.migrations.fiveStageV1=true;
    }

    try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
  }

  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

  function isDrillGroup(group){
    return String(group||"").startsWith("drill_");
  }

  function isCourseGroup(group){
    return String(group||"").startsWith("course_");
  }

  function eligible(i){
    const group=CARDS[i].group||"noun";
    // All contains only the stable vocabulary categories.
    if(mode==="all") return !isDrillGroup(group) && !isCourseGroup(group);
    return group===mode;
  }

  function buildQueue(){
    const t=now();
    const due=[], fresh=[];
    for(let i=0;i<CARDS.length;i++){
      if(!eligible(i)) continue;
      const s=state.cards[i];
      if(s.seen===0) fresh.push(i);
      else if(s.due<=t) due.push(i);
    }
    due.sort((a,b)=>state.cards[a].due-state.cards[b].due);
    queue = due.concat(fresh.slice(0,25));
    if(queue.length===0){
      queue = [...Array(CARDS.length).keys()]
        .filter(eligible)
        .sort((a,b)=>state.cards[a].stage-state.cards[b].stage)
        .slice(0,20);
    }
  }

  function currentLearningStage(cardIndex){
    const card=CARDS[cardIndex];

    // Word-based status applies ONLY while the Verbs tab is selected.
    if(mode==="verb" && (card.group||"")==="verb"){
      const key=verbKey(card);
      return Math.max(0,Math.min(5,state.verbWords[key]?.stage||0));
    }

    return Math.max(0,Math.min(5,state.cards[cardIndex]?.stage||0));
  }

  function renderCurrentStage(){
    if(current===null) return;
    const stage=currentLearningStage(current);

    if(stage===0){
      $("stageIndicator").textContent="Stage 0 / 5 · Open";
    }else if(stage===5){
      $("stageIndicator").textContent="Stage 5 / 5 · Mastered";
    }else{
      $("stageIndicator").textContent="Stage "+stage+" / 5";
    }
  }

  function updateStats(){
    let stages=[];

    if(mode==="verb"){
      const keys=[...new Set(
        [...Array(CARDS.length).keys()]
          .filter(eligible)
          .map(i=>verbKey(CARDS[i]))
      )];

      stages=keys.map(k=>
        Math.max(0,Math.min(5,state.verbWords[k]?.stage||0))
      );
    }else{
      const ids=[...Array(CARDS.length).keys()].filter(eligible);
      stages=ids.map(i=>
        Math.max(0,Math.min(5,state.cards[i]?.stage||0))
      );
    }

    const learned=stages.filter(s=>s>=1).length;
    const mastered=stages.filter(s=>s===5).length;
    const open=stages.filter(s=>s===0).length;

    $("learnedCount").textContent=learned;
    $("masteredCount").textContent=mastered;
    $("openCount").textContent=open;
    $("todayCount").textContent=(state.daily[todayKey()]||0);

    for(let level=1;level<=5;level++){
      $("stage"+level+"Count").textContent=
        stages.filter(s=>s===level).length;
    }

    $("progressBar").style.width=
      Math.min(100,sessionSeen/20*100)+"%";
  }

  function backHTML(card){
    let html=highlightedEnglish(card);
    if(isDrillGroup(mode) && card.forms && card.forms.length===3){
      html += '<div class="verb-forms">'+card.forms.join(' – ')+'</div>';
    }
    if((isDrillGroup(mode) || isCourseGroup(mode)) && card.tense){
      html += '<div class="tense-note">'+card.tense+'</div>';
    }
    return html;
  }

  function showNext(){
    if(remaining<=0){ finish(); return; }
    if(queue.length===0) buildQueue();
    if(queue.length===0){ finish(); return; }
    current=queue.shift();
    flipped=false;
    const card=CARDS[current];
    const withTense=(isDrillGroup(mode) || isCourseGroup(mode)) && card.tense;
    $("lang").textContent=withTense ? "Bulgarian · "+card.tense : "Bulgarian";
    $("sentence").innerHTML=highlightedBulgarian(card);
    $("hint").textContent="Learn the red word, then flip.";
    $("flipBtn").textContent="Show English";
    $("flipBtn").classList.remove("hidden");
    $("againBtn").classList.add("hidden");
    $("goodBtn").classList.add("hidden");
    $("audioBtn").classList.add("hidden");
    renderCurrentStage();
  }

  function esc(s){
    return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  }

  function highlightedBulgarian(card){
    const sentence=card.bg || "";
    const targets=(card.bgTargets && card.bgTargets.length ? card.bgTargets : []).filter(Boolean);
    if(!targets.length) return sentence;
    let result=sentence;
    targets
      .slice()
      .sort((a,b)=>String(b).length-String(a).length)
      .forEach(target=>{
        try{
          const rx=new RegExp("("+esc(target)+")","i");
          if(rx.test(result)){
            result=result.replace(rx,'<span class="target-word">$1</span>');
          }
        }catch(e){}
      });
    return result;
  }

  function highlightedEnglish(card){
    const sentence=card.en || "";
    const targets=(card.targets && card.targets.length ? card.targets : [card.word]).filter(Boolean);
    if(!targets.length) return sentence;
    let result=sentence;
    let matched=false;
    targets
      .slice()
      .sort((a,b)=>String(b).length-String(a).length)
      .forEach(target=>{
        try{
          const rx=new RegExp("\\b("+esc(target)+")\\b","gi");
          if(rx.test(result)){
            matched=true;
            result=result.replace(rx,'<span class="target-word">$1</span>');
          }
        }catch(e){}
      });
    if(!matched){
      result += '<div style="margin-top:18px;font-size:18px"><span class="target-word">'+targets.join(' / ')+'</span></div>';
    }
    return result;
  }

  function flip(){
    if(current===null) return;
    flipped=!flipped;
    const card=CARDS[current];
    const withTense=(isDrillGroup(mode) || isCourseGroup(mode)) && card.tense;

    if(flipped){
      $("lang").textContent=withTense ? "English · "+card.tense : "English";
      $("sentence").innerHTML=backHTML(card);
      $("hint").textContent="Know it? Learned = +1 stage · Learn again = -1 stage";
      $("flipBtn").textContent="Show Bulgarian";
      $("againBtn").classList.remove("hidden");
      $("goodBtn").classList.remove("hidden");
      $("audioBtn").classList.remove("hidden");
    } else {
      $("lang").textContent=withTense ? "Bulgarian · "+card.tense : "Bulgarian";
      $("sentence").innerHTML=highlightedBulgarian(card);
      $("hint").textContent="Learn the red word, then flip.";
      $("flipBtn").textContent="Show English";
      $("againBtn").classList.add("hidden");
      $("goodBtn").classList.add("hidden");
      $("audioBtn").classList.add("hidden");
    }
  }

  function rate(good){
    if(current===null || !flipped) return;

    const card=CARDS[current];
    const s=state.cards[current];

    s.seen++;
    sessionSeen++;
    state.daily[todayKey()] =
      (state.daily[todayKey()]||0)+1;

    // Card stage controls scheduling in every category.
    if(good){
      s.good++;
      sessionGood++;
      s.stage=Math.min(5,(s.stage||0)+1);

      // Review rhythm:
      // 1 -> 1 day, 2 -> 2 days, 3 -> 4 days,
      // 4 -> 7 days, 5/Mastered -> 14 days.
      const days=[0,1,2,4,7,14][s.stage] || 14;
      s.due=now()+days*86400000;
    }else{
      s.bad++;

      // A wrong answer moves exactly ONE stage back.
      s.stage=Math.max(0,(s.stage||0)-1);
      s.due=now()+5*60*1000;

      const pos=Math.min(3,queue.length);
      queue.splice(pos,0,current);
    }

    // Word-based progression ONLY in the normal Verbs tab.
    // A verb seen through All does NOT change this word status.
    if(mode==="verb" && (card.group||"")==="verb"){
      const key=verbKey(card);
      const w=state.verbWords[key] ||
        (state.verbWords[key]=defaultWordState());

      w.seen=(w.seen||0)+1;

      if(good){
        w.good=(w.good||0)+1;
        w.stage=Math.min(5,(w.stage||0)+1);
      }else{
        w.bad=(w.bad||0)+1;
        w.stage=Math.max(0,(w.stage||0)-1);
      }
    }

    save();
    updateStats();
    showNext();
  }

  function speak(){
    if(!flipped || current===null || !("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const text=CARDS[current].en || "";
      const u=new SpeechSynthesisUtterance(text);
      u.lang="en-US";
      u.rate=0.82;
      setTimeout(()=>speechSynthesis.speak(u),250);
    }catch(e){}
  }

  function tick(){
    if(paused) return;
    remaining--;
    renderTimer();
    if(remaining<=0) finish();
  }
  function renderTimer(){
    const m=Math.floor(remaining/60), s=remaining%60;
    $("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  }

  function togglePause(){
    paused=!paused;
    $("pauseBtn").textContent=paused?"Continue":"Pause";
  }

  function start(){
    clearInterval(timerId);
    remaining=SESSION_SECONDS; paused=false; sessionSeen=0; sessionGood=0;
    $("pauseBtn").textContent="Pause";
    $("study").classList.remove("hidden");
    $("end").classList.add("hidden");
    buildQueue(); renderTimer(); updateStats(); showNext();
    timerId=setInterval(tick,1000);
  }

  function finish(){
    clearInterval(timerId);
    $("study").classList.add("hidden");
    $("end").classList.remove("hidden");
    $("endText").textContent=`${sessionSeen} cards reviewed; ${sessionGood} successful answers.`;
    updateStats();
  }

  $("card").addEventListener("click", flip);
  $("flipBtn").addEventListener("click", flip);
  $("againBtn").addEventListener("click", ()=>rate(false));
  $("goodBtn").addEventListener("click", ()=>rate(true));
  $("audioBtn").addEventListener("click", speak);
  $("pauseBtn").addEventListener("click", togglePause);
  $("restartBtn").addEventListener("click", start);

  function setTopSection(section){
    document.querySelectorAll(".main-btn").forEach(b=>{
      b.classList.toggle("active", b.dataset.top===section);
    });

    $("vocabularyMenu").classList.toggle("hidden", section!=="vocabulary");
    $("drillMenu").classList.toggle("hidden", section!=="drill");
    $("courseMenu").classList.toggle("hidden", section!=="course");

    if(section==="course"){
      $("study").classList.add("hidden");
      $("end").classList.add("hidden");
      return;
    }

    $("study").classList.remove("hidden");
    $("end").classList.add("hidden");

    if(section==="all"){
      mode="all";
      document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
      buildQueue();
      updateStats();
      showNext();
    }
  }

  document.querySelectorAll(".main-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const section=btn.dataset.top;
      setTopSection(section);
    });
  });

  document.querySelectorAll(".filter-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      mode=btn.dataset.mode;
      document.querySelectorAll(".filter-btn").forEach(b=>b.classList.toggle("active",b===btn));

      const group=String(mode||"");
      const top=group.startsWith("drill_")
        ? "drill"
        : group.startsWith("course_")
          ? "course"
          : "vocabulary";
      document.querySelectorAll(".main-btn").forEach(b=>{
        b.classList.toggle("active", b.dataset.top===top);
      });

      $("vocabularyMenu").classList.toggle("hidden", top!=="vocabulary");
      $("drillMenu").classList.toggle("hidden", top!=="drill");
      $("courseMenu").classList.toggle("hidden", top!=="course");
      $("study").classList.remove("hidden");
      $("end").classList.add("hidden");

      buildQueue();
      updateStats();
      showNext();
    });
  });


  load(); start();
  setTopSection("all");

  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
